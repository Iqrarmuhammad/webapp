# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

  - task: AzureStaticWebApp@0
    inputs:
      # Optional: set this if your SWA resource is managed via deployment token
      azure_static_web_apps_api_token: $(deployment_token)
      
      # Path to your app source code relative to repository root
      app_location: '/' 
      
      # Path to your API code if using Azure Functions (leave empty if none)
      api_location: '' 
      
      # Built app output directory relative to app_location
      # e.g., 'build' for React, 'dist' for Vue/Angular, '' for static HTML
      output_location: 'build'

- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'
